name: Update CDC Open Data

on:
  push:
    branches:
      - main
    paths:
      - "src/cdc_open/**.py"
      - ".github/workflows/update_cdc_open.yml"
  schedule:
    - cron: "0 14 * * 6" # At 14:00 UTC on Saturday
  workflow_dispatch:

jobs:
  update-cdc-open-data:
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "latest"

      - name: Download all CDC Open datasets
        env:
          CDC_DATA_APP_TOKEN: ${{ secrets.CDC_DATA_APP_TOKEN }}
        run: |
          uv run python -m cdc_open.download

      - name: Fetch respiratory hospitalization data
        env:
          CDC_DATA_APP_TOKEN: ${{ secrets.CDC_DATA_APP_TOKEN }}
        run: |
          uv run python -m cdc_open.fetch_resp

      - name: Aggregate wastewater data into weekly rollups
        run: |
          uv run python -m cdc_open.aggregate

      - name: Commit and push changes
        run: |
          git status
          git config --local user.email "noreply@github.com"
          git config --local user.name "github-actions[bot]"

          # Safety net: a dataset can grow past GitHub's 100MB hard limit
          # between reviews (this has happened more than once as pagination
          # stopped silently truncating results). Rather than let one
          # oversized file fail the whole push, skip it here and flag it --
          # then give it `enabled=False` in datasets.py so it stops being
          # fetched at all.
          for f in $(find data/raw/cdc_open data/raw/resp -name '*.csv' -size +95M 2>/dev/null); do
            echo "::warning::$f is $(du -h "$f" | cut -f1) -- exceeds safe git file size, skipping commit. Give it enabled=False in datasets.py."
            git rm --cached --ignore-unmatch "$f" >/dev/null 2>&1 || true
          done

          git add data/raw/cdc_open/ data/raw/resp/ data/processed/cdc_open/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update of CDC Open Data on $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push -u origin main
          fi
