name: Update SEER Data

on:
  schedule:
    - cron: "0 15 1 * *" # At 15:00 UTC on the 1st of each month (SEER re-releases annually, not weekly)
  workflow_dispatch:

jobs:
  update-seer-data:
    runs-on: ubuntu-latest
    environment:
      name: prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "latest"

      - name: Download SEER cancer site catalog and mortality data
        run: |
          uv run python -m seer.download

      - name: Commit and push changes
        run: |
          git status
          git config --local user.email "noreply@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/raw/seer/
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update of SEER data on $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push -u origin main
          fi
