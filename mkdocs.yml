site_name: US Health Data APIs
site_description: Query guides for CDC WONDER, GRASP, WISQARS, NSSP, NIS, and CDC Open Data
site_url: https://boris-ning.github.io/health/
repo_url: https://github.com/boris-ning/health
repo_name: health

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - footnotes
  - toc:
      permalink: true

nav:
  - Home: index.md
  - WONDER:
    - Overview: wonder/index.md
    - Multi-Year Queries: wonder/multi-year.md
    - All-State Queries: wonder/multi-state.md
    - Example Gallery: wonder/examples.md
    - Dataset Reference: wonder/datasets.md
    - Parameter Reference: wonder/parameters.md
    - Troubleshooting: wonder/troubleshooting.md
  - GRASP / FluView: grasp.md
  - WISQARS: wisqars.md
  - NSSP: nssp.md
  - NIS: nis.md
  - CDC Open Data: cdc-open.md

plugins:
  - search
