[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "health"
version = "1.0.0"
description = "To collect various health API around the US"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic==0.112.0",
    "beautifulsoup4==4.15.0",
    "curl-cffi==0.15.0",
    "lxml==6.1.1",
    "matplotlib==3.11.0",
    "pandas==3.0.3",
    "playwright==1.60.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "zensical==0.0.46",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wonder = "wonder.main:main"
cdc-open = "cdc_open.main:main"
nssp = "nssp.main:main"
wisqars = "wisqars.main:main"
nis = "nis.main:main"
grasp = "grasp.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test (requires API key)",
]
pythonpath = ["src"]
