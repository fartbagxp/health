[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health"
version = "1.0.0"
description = "To collect various health API around the US"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic==2.3.0",
    "beautifulsoup4==4.15.0",
    "curl-cffi==0.16.3",
    "lxml==6.1.3",
    "matplotlib==3.11.2",
    "pandas==3.1.0",
    "playwright==1.64.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "zensical==0.0.72",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wonder = "wonder.main:main"
cdc-open = "cdc_open.main:main"
nssp = "nssp.main:main"
wisqars = "wisqars.main:main"
nis = "nis.main:main"
grasp = "grasp.main:main"
seer = "seer.main:main"
dqs = "nchs_dqs.main:main"
epht = "epht.main:main"
places = "places.main:main"
health-depts = "health_depts.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: mark test as integration test (requires API key)",
]
pythonpath = ["src"]
