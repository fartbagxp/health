[project]
site_name = "US Health Data APIs"
site_description = "Query guides for CDC WONDER, GRASP, WISQARS, NSSP, NIS, CDC Open Data, and state/local health sources"
site_url = "https://boris-ning.github.io/health/"

nav = [
  { Home = "index.md" },
  { "Data Catalog" = "data-catalog.md" },
  { WONDER = [
    { Overview = "wonder/index.md" },
    { "Multi-Year Queries" = "wonder/multi-year.md" },
    { "All-State Queries" = "wonder/multi-state.md" },
    { "Example Gallery" = "wonder/examples.md" },
    { "Dataset Reference" = "wonder/datasets.md" },
    { "Parameter Reference" = "wonder/parameters.md" },
    { Troubleshooting = "wonder/troubleshooting.md" },
  ]},
  { "GRASP / FluView" = "grasp.md" },
  { WISQARS = "wisqars.md" },
  { NSSP = "nssp.md" },
  { NIS = "nis.md" },
  { "CDC Open Data" = "cdc-open.md" },
  { SEER = "seer.md" },
  { "State & Local" = "local.md" },
  { "State Portals" = "state-portals.md" },
]

[project.theme]
language = "en"
features = [
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.sections",
    "navigation.top",
    "navigation.footer",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
